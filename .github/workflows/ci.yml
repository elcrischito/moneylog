# CI — runs on every Pull Request into staging and main (NFR-08).
# Backend: migrations + seed + unit and API/DB tests against a throw-away PostgreSQL.
# Frontend: component tests + production build.
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneylog
          POSTGRES_PASSWORD: moneylog
          POSTGRES_DB: moneylog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Backend — install, migrate, seed, test, build
        working-directory: server
        env:
          DATABASE_URL: postgresql://moneylog:moneylog@localhost:5432/moneylog?schema=public
        run: |
          npm ci
          npx prisma migrate deploy
          npm run prisma:seed
          npm test
          npm run build

      - name: Frontend — install, test, build
        working-directory: client
        run: |
          npm ci
          npm test
          npm run build
